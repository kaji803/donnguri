<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>どんぐり名前当てクイズ</title>
<style>
:root{--green:#287a50;--mint:#e7f4e9;--cream:#fffaf0;--ink:#26352b;--gold:#f2c66d}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#f5faef,#fffaf0);font-family:"Meiryo","Yu Gothic",sans-serif;color:var(--ink);min-height:100vh}
header{text-align:center;padding:28px 16px 18px;background:#e4f1dc;border-bottom:4px solid #c8dfbd}
h1{margin:0;font-size:clamp(25px,5vw,38px);color:#285f3f;letter-spacing:.04em}
header p{margin:9px 0 0;color:#526b55}
main{max-width:760px;margin:24px auto;padding:0 16px 40px}
.panel{background:white;border:2px solid #dcebd8;border-radius:22px;padding:22px;box-shadow:0 6px 18px #456b3512}
.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pill{background:var(--mint);color:#28613e;padding:7px 13px;border-radius:999px;font-weight:bold}
.progress{height:10px;background:#edf1e9;border-radius:20px;overflow:hidden;margin:10px 0 20px}
.bar{height:100%;width:0;background:#65a875;transition:width .25s}
.question{text-align:center;font-weight:bold;font-size:21px;margin:6px 0 12px}
.image-wrap{width:190px;height:190px;margin:0 auto 18px;border-radius:18px;background:#fff;border:1px solid #e5eadf;display:grid;place-items:center;overflow:hidden}
.image-wrap img{width:100%;height:100%;object-fit:contain}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.answer{border:2px solid #dce8d8;border-radius:14px;background:#fbfdf9;padding:14px 10px;font-size:17px;font-weight:bold;color:#35523b;cursor:pointer;transition:.15s}
.answer:hover:not(:disabled){background:#edf7e9;border-color:#8fbd91;transform:translateY(-1px)}
.answer:disabled{cursor:default;opacity:1}
.answer.correct{background:#e3f5e4;border-color:#4c9b5b;color:#246334}
.answer.wrong{background:#fff0e9;border-color:#db9275;color:#91482e}
.feedback{min-height:54px;text-align:center;font-size:17px;font-weight:bold;padding:15px 4px 4px}
.feedback.good{color:#287a50}.feedback.bad{color:#b35c3e}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
button.primary{background:var(--green);color:white;border:0;border-radius:999px;padding:12px 28px;font-size:16px;font-weight:bold;cursor:pointer}
button.secondary{background:#f2f5ef;color:#426047;border:1px solid #cbdcc8;border-radius:999px;padding:12px 22px;font-size:15px;cursor:pointer}
button:focus-visible{outline:3px solid #e1ad43;outline-offset:3px}
.result{text-align:center;padding:12px 0}
.result .score{font-size:42px;font-weight:bold;color:#287a50;margin:12px}
.result p{font-size:18px}
.hidden{display:none}
.note{text-align:center;color:#748174;font-size:13px;margin-top:15px}
@media(max-width:520px){.panel{padding:16px}.answers{grid-template-columns:1fr}.image-wrap{width:170px;height:170px}.answer{padding:12px}}
</style>
</head>
<body>
<header>
  <h1>🌰 どんぐり名前当てクイズ</h1>
  <p>写真を見て、どんぐりの名前を当てよう！</p>
</header>
<main>
  <section class="panel" id="quiz">
    <div class="topline">
      <span class="pill" id="count">第1問 / 全17問</span>
      <span class="pill" id="score">正解 0</span>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="question">このどんぐりの名前は何でしょう？</div>
    <div class="image-wrap"><img id="acorn" alt="名前を当てるどんぐりの写真"></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="controls">
      <button class="primary hidden" id="next">次の問題へ</button>
    </div>
  </section>
  <section class="panel result hidden" id="result">
    <div style="font-size:48px">🎉</div>
    <h2>クイズ終了！</h2>
    <div class="score" id="finalScore"></div>
    <p id="comment"></p>
    <div class="controls">
      <button class="primary" id="retry">もう一度チャレンジ</button>
      <button class="secondary" id="review">まちがえた問題を復習</button>
    </div>
  </section>
  <p class="note">全17種類・選択式クイズ</p>
</main>

let questions=[], index=0, correct=0, answered=false, wrongItems=[];
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(list=acorns){
  questions=shuffle(list); index=0; correct=0; wrongItems=[]; 
  $("quiz").classList.remove("hidden"); $("result").classList.add("hidden");
  showQuestion();
}
function showQuestion(){
  answered=false;
  const q=questions[index];
  $("count").textContent=`第${index+1}問 / 全${questions.length}問`;
  $("score").textContent=`正解 ${correct}`;
  $("bar").style.width=`${index/questions.length*100}%`;
  $("acorn").src=q.image;
  $("feedback").textContent=""; $("feedback").className="feedback";
  $("next").classList.add("hidden");
  const choices=shuffle([q,...shuffle(acorns.filter(x=>x.name!==q.name)).slice(0,3)]);
  $("answers").innerHTML="";
  choices.forEach(choice=>{
    const b=document.createElement("button");
    b.className="answer"; b.textContent=choice.name;
    b.addEventListener("click",()=>choose(b,choice.name,q.name));
    $("answers").appendChild(b);
  });
}
function choose(button,selected,answer){
  if(answered)return;
  answered=true;
  const buttons=[...$("answers").children];
  buttons.forEach(b=>{
    b.disabled=true;
    if(b.textContent===answer)b.classList.add("correct");
  });
  if(selected===answer){
    correct++; $("feedback").textContent="正解！よくできました！ 🌟";
    $("feedback").classList.add("good");
  }else{
    button.classList.add("wrong");
    $("feedback").textContent=`おしい！ 正解は「${answer}」です。`;
    $("feedback").classList.add("bad");
    wrongItems.push(questions[index]);
  }
  $("score").textContent=`正解 ${correct}`;
  $("next").textContent=index===questions.length-1?"結果を見る":"次の問題へ";
  $("next").classList.remove("hidden");
}
$("next").addEventListener("click",()=>{
  index++;
  if(index<questions.length)showResultOrNext();
  else finish();
});
function showResultOrNext(){showQuestion()}
function finish(){
  $("quiz").classList.add("hidden"); $("result").classList.remove("hidden");
  $("bar").style.width="100%";
  $("finalScore").textContent=`${correct} / ${questions.length} 問正解`;
  const rate=correct/questions.length;
  $("comment").textContent=rate===1?"全問正解！どんぐり博士だね！":rate>=.7?"すごい！たくさん覚えられたね！":"よくチャレンジしたね！もう一度挑戦してみよう！";
  $("review").classList.toggle("hidden",wrongItems.length===0);
}
$("retry").addEventListener("click",()=>start());
$("review").addEventListener("click",()=>start(wrongItems));
start();
</script>
